{% extends "base.html" %}
{% block content %}
<h1>Analyze a sequence</h1>
<p class="muted">Paste or upload a FASTA. Both architectures predict live, then occlusion attribution runs on demand.</p>

<div class="form-panel">
  <label class="label">Sequence</label>
  <textarea id="seq-input" class="textarea" rows="8" placeholder=">my_sequence&#10;ATGCGTACGT..."></textarea>
  <div class="form-row">
    <label class="file-btn">
      <input type="file" id="file-input" accept=".fa,.fasta,.fna,.txt" style="display:none">
      <span>📁 Upload FASTA</span>
    </label>
    <button id="predict-btn" class="btn btn-primary">Predict</button>
  </div>
  <div id="error" class="error" style="display:none"></div>
</div>

<div id="prediction-panel" style="display:none">
  <h2>Prediction</h2>
  <div class="pred-grid">
    <div class="pred-card cnn">
      <div class="pred-label">CNN</div>
      <div id="cnn-class" class="pred-class">-</div>
      <div id="cnn-conf" class="pred-conf">-</div>
      <div id="cnn-chart" class="chart"></div>
    </div>
    <div class="pred-card bilstm">
      <div class="pred-label">BiLSTM</div>
      <div id="bilstm-class" class="pred-class">-</div>
      <div id="bilstm-conf" class="pred-conf">-</div>
      <div id="bilstm-chart" class="chart"></div>
    </div>
  </div>
  <div class="attr-section">
    <button id="attr-btn" class="btn btn-primary">Run attribution (~30s)</button>
    <div id="attr-progress" class="progress" style="display:none">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <div id="progress-label" class="muted">Queued...</div>
    </div>
  </div>
  <div id="attr-panel" style="display:none">
    <h2>Attribution</h2>
    <div id="attr-chart-cnn" class="chart-lg"></div>
    <div id="attr-chart-bilstm" class="chart-lg"></div>
    <div id="attr-agreement" class="agreement-card"></div>
    
    <div class="attr-section" style="margin-top: 1.5rem;">
      <button id="fidelity-btn" class="btn btn-primary" style="background: linear-gradient(135deg, #10B981, #059669);">Run Live Fidelity Test (Delete Top 10%)</button>
      <div id="fidelity-result" style="display:none; margin-top: 1.5rem;"></div>
    </div>

    <h3>Top attributed regions</h3>
    <table id="top-regions" class="table"></table>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
const VIR_COLORS = {dengue:"#3B82F6",chikungunya:"#A855F7",hcv:"#F97316",norovirus:"#14B8A6"};
const VIR_LABELS = {dengue:"Dengue",chikungunya:"Chikungunya",hcv:"HCV",norovirus:"Norovirus"};

document.getElementById('file-input').addEventListener('change', async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  document.getElementById('seq-input').value = await f.text();
});

document.getElementById('predict-btn').addEventListener('click', async () => {
  const seq = document.getElementById('seq-input').value.trim();
  const err = document.getElementById('error');
  err.style.display = 'none';
  if (!seq) { err.textContent = 'Provide a sequence.'; err.style.display='block'; return; }

  const btn = document.getElementById('predict-btn');
  btn.disabled = true; btn.textContent = 'Predicting...';
  try {
    const r = await fetch('/api/predict', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({sequence: seq})
    });
    if (!r.ok) {
      let errBody;
      try { errBody = await r.json(); } catch(e) { errBody = {}; }
      let msg = 'Prediction failed';
      if (typeof errBody.detail === 'string') {
        msg = errBody.detail;
      } else if (Array.isArray(errBody.detail)) {
        msg = errBody.detail.map(e => {
          const loc = e.loc ? e.loc.filter(x => x !== 'body').join('.') : '';
          return (loc ? loc + ': ' : '') + e.msg;
        }).join('\n');
      } else if (errBody.detail) {
        msg = JSON.stringify(errBody.detail);
      }
      throw new Error(msg);
    }
    const data = await r.json();
    renderPredictions(data);
  } catch (ex) {
    err.textContent = ex.message; err.style.display = 'block';
  } finally {
    btn.disabled = false; btn.textContent = 'Predict';
  }
});

function renderPredictions(data) {
  console.log('[DEBUG] /api/predict response:', JSON.stringify(data, null, 2));
  document.getElementById('prediction-panel').style.display = 'block';
  for (const model of ['cnn','bilstm']) {
    const d = data[model];
    if (!d) { console.error('[BUG] missing', model, 'in response'); continue; }
    if (typeof d.virus !== 'string') console.error('[BUG] virus is not string:', d.virus);
    if (!Array.isArray(d.probs)) console.error('[BUG] probs is not array:', d.probs);
    document.getElementById(model+'-class').textContent = VIR_LABELS[d.virus] || String(d.virus);
    document.getElementById(model+'-class').style.color = VIR_COLORS[d.virus];
    document.getElementById(model+'-conf').textContent = 'confidence ' + (d.confidence*100).toFixed(1) + '%';

    const viruses = ['dengue','chikungunya','hcv','norovirus'];
    const trace = {
      type: 'bar', orientation: 'h',
      x: d.probs, y: viruses.map(v => VIR_LABELS[v]),
      marker: {color: viruses.map(v => VIR_COLORS[v])},
      text: d.probs.map(p => p.toFixed(2)), textposition: 'outside',
      textfont: {color: '#F8FAFC'},
    };
    const layout = {
      height: 200, margin: {l:60,r:40,t:10,b:10},
      xaxis: {range:[0,1], gridcolor:'rgba(148,163,184,0.15)', color:'#94A3B8'},
      yaxis: {showgrid:false, color:'#F8FAFC'},
      plot_bgcolor:'rgba(0,0,0,0)', paper_bgcolor:'rgba(0,0,0,0)',
      font: {family:'Inter', color:'#F8FAFC'},
    };
    Plotly.newPlot(model+'-chart', [trace], layout, {displayModeBar:false});
  }
  // wire attribution
  document.getElementById('attr-btn').onclick = runAttribution;
}

async function runAttribution() {
  const seq = document.getElementById('seq-input').value.trim();
  const progress = document.getElementById('attr-progress');
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-label');
  progress.style.display = 'block';
  fill.style.width = '5%';
  label.textContent = 'Queued...';

  try {
    const r = await fetch('/api/attribute', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({sequence: seq})
    });
    const {job_id} = await r.json();
    pollJob(job_id);
  } catch (ex) {
    label.textContent = 'Error: ' + ex.message;
  }
}

async function pollJob(jobId) {
  const fill = document.getElementById('progress-fill');
  const label = document.getElementById('progress-label');
  const interval = setInterval(async () => {
    const r = await fetch('/api/attribute/' + jobId);
    const j = await r.json();
    if (j.status === 'running') {
      fill.style.width = j.progress === 'cnn' ? '30%' : (j.progress === 'bilstm' ? '70%' : '50%');
      label.textContent = 'Running: ' + j.progress;
    } else if (j.status === 'done') {
      clearInterval(interval);
      fill.style.width = '100%';
      label.textContent = 'Complete';
      setTimeout(() => { document.getElementById('attr-progress').style.display='none'; }, 800);
      renderAttribution(j.result);
    } else if (j.status === 'error') {
      clearInterval(interval);
      label.textContent = 'Error: ' + j.error;
    }
  }, 800);
}

function renderAttribution(res) {
  document.getElementById('attr-panel').style.display = 'block';
  for (const model of ['cnn','bilstm']) {
    const d = res[model];
    const positions = Array.from({length: d.n_bins}, (_,i) => i * d.bin_size_bp / 1000);
    const trace = {
      type: 'bar', x: positions, y: d.importance,
      marker: {color: VIR_COLORS[d.prediction] || '#A855F7'},
      hovertemplate: 'pos %{x:.1f} kb<br>importance %{y:.2e}<extra></extra>',
    };
    const shapes = [];
    const annotations = [];
    if (res.genes) {
      for (const [name, spans] of Object.entries(res.genes)) {
        spans.forEach(([s,e], i) => {
          shapes.push({type:'rect', x0:s/1000, x1:e/1000, y0:0, y1:1, yref:'paper',
                       fillcolor:'rgba(251,191,36,0.12)', line:{width:0}});
          if (i === 0) annotations.push({x:(s+e)/2000, y:1, yref:'paper', text:name,
                                        showarrow:false, font:{size:9,color:'#FBBF24'}});
        });
      }
    }
    const layout = {
      height: 280, margin: {l:50,r:20,t:40,b:30},
      title: {text: model.toUpperCase() + ' attribution · predicted ' + VIR_LABELS[d.prediction],
              font:{color:'#F8FAFC',size:13}},
      xaxis: {title:'genome position (kb)', color:'#94A3B8', gridcolor:'rgba(148,163,184,0.15)'},
      yaxis: {title:'importance', color:'#94A3B8', gridcolor:'rgba(148,163,184,0.15)'},
      plot_bgcolor:'rgba(0,0,0,0)', paper_bgcolor:'rgba(0,0,0,0)',
      font: {family:'Inter', color:'#F8FAFC'},
      shapes, annotations, bargap: 0,
    };
    Plotly.newPlot('attr-chart-'+model, [trace], layout, {displayModeBar:false});
  }

  // agreement
  const a = res.cnn.importance, b = res.bilstm.importance;
  const n = Math.min(a.length, b.length);
  const rank = (arr) => {
    const idx = arr.map((v,i) => [v,i]).sort((x,y) => y[0]-x[0]);
    const r = new Array(arr.length);
    idx.forEach(([_,i], j) => { r[i] = j+1; });
    return r;
  };
  const ra = rank(a.slice(0,n)), rb = rank(b.slice(0,n));
  const d2 = ra.map((v,i) => (v-rb[i])**2).reduce((x,y) => x+y, 0);
  const rho = 1 - (6*d2) / (n*(n*n - 1));
  document.getElementById('attr-agreement').innerHTML =
    '<div class="agreement-label">Cross-architecture agreement</div>' +
    '<div class="agreement-value">ρ = ' + rho.toFixed(3) + '</div>' +
    '<div class="agreement-note">Spearman correlation between CNN and BiLSTM importance rankings on this sequence.</div>';

  // top regions
  const combined = a.map((v,i) => (v + (b[i]||0)) / 2);
  const top = combined.map((v,i) => [v,i]).sort((x,y) => y[0]-x[0]).slice(0,10);
  let html = '<thead><tr><th>Rank</th><th>Position (bp)</th><th>CNN</th><th>BiLSTM</th><th>Combined</th></tr></thead><tbody>';
  top.forEach(([val, i], rank) => {
    const s = i * res.cnn.bin_size_bp;
    const e = Math.min(s + res.cnn.bin_size_bp, res.sequence_length);
    html += '<tr><td>' + (rank+1) + '</td><td>' + s.toLocaleString() + '–' + e.toLocaleString() + '</td>' +
            '<td>' + a[i].toExponential(2) + '</td>' +
            '<td>' + (b[i]||0).toExponential(2) + '</td>' +
            '<td>' + val.toExponential(2) + '</td></tr>';
  });
  html += '</tbody>';
  document.getElementById('top-regions').innerHTML = html;

  // Wire up live fidelity
  document.getElementById('fidelity-btn').onclick = async () => {
    const btn = document.getElementById('fidelity-btn');
    const resDiv = document.getElementById('fidelity-result');
    btn.disabled = true; btn.textContent = 'Running...';
    resDiv.style.display = 'none';

    try {
      const results = [];
      for (const model of ['cnn', 'bilstm']) {
        const r = await fetch('/api/fidelity', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ sequence: document.getElementById('seq-input').value.trim(), model: model, attribution: res[model] })
        });
        results.push({model, data: await r.json()});
      }

      let html = '<h4>Live Fidelity Results</h4><div class="pred-grid">';
      for (const {model, data} of results) {
        const isFaithful = data.delta > 0;
        const color = isFaithful ? '#10B981' : '#EF4444';
        const label = isFaithful ? 'Faithful ✓' : 'Anti-faithful ✗';
        
        html += `
          <div class="pred-card" style="border-color: ${color}">
            <div class="pred-label">${model.toUpperCase()}</div>
            <div class="pred-class" style="color: ${color}; font-size: 1.4rem;">${label}</div>
            <div class="pred-conf">Confidence drop: <b>${data.delta > 0 ? '+' : ''}${(data.delta*100).toFixed(2)}%</b></div>
            <div class="muted" style="font-size: 0.8rem; margin-top: 0.5rem;">
              Base: ${(data.base_prob*100).toFixed(1)}% → Masked: ${(data.masked_prob*100).toFixed(1)}%<br>
              New prediction: ${data.new_prediction}
            </div>
          </div>
        `;
      }
      html += '</div><p class="muted" style="margin-top:1rem;">Deleting the top 10% of attributed bins should cause a significant positive drop in confidence. A negative drop means the attribution was anti-faithful.</p>';
      
      resDiv.innerHTML = html;
      resDiv.style.display = 'block';
    } catch (e) {
      resDiv.innerHTML = '<div class="error">Fidelity test failed: ' + e.message + '</div>';
      resDiv.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Run Live Fidelity Test (Delete Top 10%)';
    }
  };
}
</script>
{% endblock %}
