<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}xAI Viral Attribution{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
</head>
<body>
<nav class="nav">
  <a href="/" class="brand">
    <span class="brand-icon">🧬</span>
    <span>xAI Viral Attribution</span>
  </a>
  <div class="nav-links">
    <a href="/analyze" {% if active=='analyze' %}class="active"{% endif %}>Analyze</a>
    <a href="/explore" {% if active=='explore' %}class="active"{% endif %}>Explore</a>
    <a href="/study" {% if active=='study' %}class="active"{% endif %}>Study</a>
    <a href="/docs" target="_blank">API</a>
  </div>
</nav>
<main class="container">
{% block content %}{% endblock %}
</main>
<footer class="footer">
  <div>xAI Viral Attribution · BSc Data Science and Analytics · Uganda Christian University</div>
  <div class="muted">Evaluating stability, fidelity and plausibility of feature attributions in viral classifiers</div>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
