project:
  name: Multi-Family Viral Lineage Classifier
  seed: 42
  version: 1.0.0

viruses:
  dengue:
    family: Flaviviridae
    genome: +ssRNA_single_ORF
    antigenic_gene: E
    conserved_gene: NS5
    test_lineages: ["DENV-4"]
    train_lineages: ["DENV-1", "DENV-2", "DENV-3"]

  chikungunya:
    family: Togaviridae
    genome: +ssRNA_alphavirus
    antigenic_gene: E1
    conserved_gene: nsP1
    test_lineages: ["Asian"]
    train_lineages: ["ECSA"]

  hcv:
    family: Flaviviridae
    genome: +ssRNA_single_ORF
    antigenic_gene: E2
    conserved_gene: NS5B
    test_lineages: ["GT6"]
    train_lineages: ["GT1", "GT2", "GT4"]

  norovirus:
    family: Caliciviridae
    genome: +ssRNA_single_ORF
    antigenic_gene: VP1
    conserved_gene: RdRp
    test_lineages: ["GI"]
    train_lineages: ["GII", "GV", "GIX"]

clustering:
  tool: mmseqs2
  thresholds: [0.90, 0.95]

training:
  architectures: [cnn, bilstm]
  label_smoothing: 0.1
  weight_decay: 0.0001
  patience: 5
  device: cpu

attribution:
  methods: [occlusion, permutation, ig, kernelshap]
  resolution_bp: 100
  ig_steps: 16
  kernelshap_coalitions: 100
  sequences_per_lineage: 15

evaluation:
  bootstrap: 500
  deletion_levels: [0.01, 0.05, 0.10, 0.20]
  plausibility_top_frac: 0.10
